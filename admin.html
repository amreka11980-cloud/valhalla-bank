    <!-- =========================

        <h1>

    <!-- =========================

    <!-- =========================

    <script>

        const adminMenuBtn =
            document.getElementById("adminMenuBtn");

        const adminSideMenu =
            document.getElementById("adminSideMenu");


        adminMenuBtn.addEventListener("click", function(event) {

            event.stopPropagation();

            adminSideMenu.classList.toggle("active");

        });


        adminSideMenu.addEventListener("click", function(event) {

            event.stopPropagation();

        });


        document.addEventListener("click", function() {

            adminSideMenu.classList.remove("active");

        });

    </script>
